<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Enrollment</title>
  <link rel="stylesheet" type="text/css" href="style.css">
  <style>
    body {
      background-image: url(images/Coding.jpg);
      background-size: cover;
      background-position: center;
      font-family: Arial, sans-serif;
    }

    .container {
      background-color: transparent;
      padding: 25px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
      border: 1px solid rgba(255, 255, 255, 0.18);
      max-width: 600px;
      margin: auto;
    }

    label {
      color: aquamarine;
      display: block;
      margin-top: 10px;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="date"] {
      width: 100%;
      padding: 10px;
      margin: 5px 0 15px;
      border: none;
      border-radius: 5px;
    }

    .submit-button {
      background-color: #4CAF50;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }

    .submit-button:hover {
      background-color: #45a049;
    }

    header h1 {
      text-align: center;
      color: rgb(168, 234, 245);
    }

    .main-nav {
      text-align: center;
      margin-bottom: 20px;
    }

    .main-nav a {
      color: #555;
      margin: 0 15px;
      text-decoration: none;
      font-weight: bold;
    }

    h3 {
      text-align: center;
      color: white;
    }
  </style>
</head>
<body>

  <header>
    <h1>REAN CODE</h1>
    <nav class="main-nav">
      <a href="Home.html">Home</a>
      <a href="Our University.html">About Us</a>
      <a href="Our Courses.html">Our Courses</a>
      <a href="Enrollment.html">Enrollment</a>
      <a href="Contact Us.html">Contact Us</a>
    </nav>
  </header>

  <h3>Let's Improve your Computer skills and Programming skills with us</h3>

  <div class="container">
    <h1>Let's Improve your skills with us</h1>
    <form onsubmit="redirectToPayment(); return false;">
      <label>Anticipated Start Date:</label>
      <input type="date" required>

      <label>Student’s Name:</label>
      <input type="text" placeholder="First Name" required>
      <input type="text" placeholder="Last Name" required>

      <label>Student’s Date of Birth:</label>
      <input type="date" required>

      <label>Email Address:</label>
      <input type="email" placeholder="Email Address" required>

      <label>Phone Number:</label>
      <input type="tel" placeholder="Phone Number" required>

      <input type="submit" value="Pay Now" class="submit-button">
    </form>
  </div>

  <script>
    function redirectToPayment() {
      // Change this URL to your actual payment page or gateway
      window.location.href = "pay.html";
    }
  </script>
</body>
</html>
